[package]
name = "bzdium"
version = "0.2.13"
description = "bzdium — a light multi-messenger (Rust/WebView2 port of the Ferdium concept)"
edition = "2021"
rust-version = "1.98"

[lib]
name = "bzdium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary is a thin dispatcher (app startup / --mcp-stdio) with no code of
# its own to unit test, so it opts out of the automatically generated test
# harness. This also keeps the manifest embedded by tauri-build and the one
# build.rs adds for test binaries from both trying to attach to the same
# executable, which link.exe rejects with LNK1123. All testable logic lives in
# the library and is covered there.
[[bin]]
name = "bzdium"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }

# --- Agent Access Layer (MCP + REST/OpenAPI) --------------------------------
# Every crate below is ALREADY resolved in Cargo.lock as a transitive
# dependency of tauri/wry, so declaring them direct adds no new download and
# no new supply-chain surface. Deliberately NOT using axum or rmcp: the repo's
# identity is a 4-12 MB binary with a minimal dependency tree, and both
# protocol surfaces are small enough to implement directly against the specs.
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "io-std",
    "macros",
] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# ShellExecuteW for external links. Direct FFI instead of tauri-plugin-opener:
# no new plugin, no new ACL permission, and the `windows` crate the plugin
# would pull in is already in the tree via wry. windows-sys 0.61 is likewise
# already resolved. See rust-toolchain.toml for the compiler pin.
# Win32_UI_WindowsAndMessaging is required by ShellExecuteW's own signature
# (SHOW_WINDOW_CMD) and for the SW_SHOWNORMAL constant.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
urlpattern = "0.6"
regex = "1"

# Note: rustc 1.99.0 crashes (STATUS_HEAP_CORRUPTION / ACCESS_VIOLATION in the
# compiler itself) building dependencies with `codegen-units = 1` +
# `panic = "abort"`; thin LTO with default codegen units is stable and still
# produces a small binary.
[profile.release]
opt-level = 3
lto = "thin"
