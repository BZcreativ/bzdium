[package]
name = "bzdium"
version = "0.1.0"
description = "bzdium — a light multi-messenger (Rust/WebView2 port of the Ferdium concept)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bzdium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
winreg = "0.55"

[dev-dependencies]
urlpattern = "0.6"
regex = "1"

# Note: rustc 1.99.0 crashes (STATUS_HEAP_CORRUPTION / ACCESS_VIOLATION in the
# compiler itself) building dependencies with `codegen-units = 1` +
# `panic = "abort"`; thin LTO with default codegen units is stable and still
# produces a small binary.
[profile.release]
opt-level = 3
lto = "thin"
