[package]
name = "bzdium"
version = "0.2.8"
description = "bzdium — a light multi-messenger (Rust/WebView2 port of the Ferdium concept)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bzdium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# ShellExecuteW for external links. Direct FFI instead of tauri-plugin-opener:
# no new plugin, no new ACL permission, and the `windows` crate the plugin
# would pull in is already in the tree via wry. windows-sys 0.61 is likewise
# already resolved. See rust-toolchain.toml for the compiler pin.
# Win32_UI_WindowsAndMessaging is required by ShellExecuteW's own signature
# (SHOW_WINDOW_CMD) and for the SW_SHOWNORMAL constant.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
urlpattern = "0.6"
regex = "1"

# Note: rustc 1.99.0 crashes (STATUS_HEAP_CORRUPTION / ACCESS_VIOLATION in the
# compiler itself) building dependencies with `codegen-units = 1` +
# `panic = "abort"`; thin LTO with default codegen units is stable and still
# produces a small binary.
[profile.release]
opt-level = 3
lto = "thin"
